# EnglishBGSU
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Polyglot">
    <title>Мій Словник Pro</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f2f2f7; color: #1c1c1e;
            display: flex; flex-direction: column; align-items: center;
            padding: 20px 15px; margin: 0; padding-top: 50px;
        }
        .container {
            background-color: white; padding: 20px; border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%;
            max-width: 400px; margin-bottom: 20px; text-align: center; box-sizing: border-box;
        }
        h2 { margin-top: 0; font-size: 20px; }
        
        textarea, input[type="text"], select {
            width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #d1d1d6;
            border-radius: 10px; font-size: 16px; box-sizing: border-box; background-color: #f2f2f7;
        }
        select { background-color: #e5e5ea; font-weight: bold; }
        
        button {
            background-color: #007aff; color: white; border: none; padding: 14px 20px;
            border-radius: 10px; cursor: pointer; font-size: 17px; font-weight: 600;
            width: 100%; margin-top: 10px; transition: opacity 0.2s;
        }
        button:active { opacity: 0.7; }
        
        .score-board {
            display: flex; justify-content: space-between; background-color: #fff4ce;
            padding: 10px; border-radius: 10px; font-weight: bold; margin-bottom: 15px;
            color: #d35400; font-size: 14px;
        }

        .blitz-board {
            background-color: #ffeff0; color: #ff3b30; padding: 10px; border-radius: 10px;
            font-weight: bold; font-size: 18px; margin-bottom: 15px; display: flex; justify-content: space-between;
        }

        #word-to-translate {
            font-size: 32px; font-weight: bold; color: #007aff; margin: 15px 0;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        
        .audio-btn {
            background-color: #f2f2f7; color: #007aff; width: 40px; height: 40px;
            border-radius: 20px; padding: 0; margin: 0; display: flex;
            justify-content: center; align-items: center; font-size: 20px;
        }

        .option-btn { background-color: #e5e5ea; color: #1c1c1e; margin: 6px 0; }
        .hint-btn { background-color: #ffeaa7; color: #d35400; margin: 6px 0; font-size: 15px; }
        #hint-text { font-style: italic; color: #7f8c8d; margin-bottom: 15px; }
        
        #feedback { 
            font-size: 18px; font-weight: bold; margin: 15px 0; min-height: 50px;
            display: flex; align-items: center; justify-content: center; line-height: 1.4;
        }
        .correct { color: #34c759; }
        .wrong { color: #ff3b30; }
        .hidden { display: none !important; }

        /* Верхня панель кнопок */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .library-btn { background-color: #34c759; margin: 0; flex-grow: 1; margin-right: 10px; }
        .admin-lock-btn { background-color: #34495e; width: auto; margin: 0; padding: 14px 15px; }
        
        /* Панель адміністратора */
        .admin-panel { background-color: #2c3e50; color: white; border: 2px solid #f1c40f; }
        .admin-panel h2 { color: #f1c40f; }
        .admin-panel textarea { background-color: #34495e; color: white; border-color: #7f8c8d; }
        .admin-panel button { background-color: #f1c40f; color: #2c3e50; font-weight: bold; }
        .close-admin-btn { background-color: #e74c3c !important; color: white !important; margin-top: 5px !important; }

        #word-list { text-align: left; max-height: 250px; overflow-y: auto; padding: 0; list-style: none; }
        #word-list li { padding: 10px 0; border-bottom: 1px solid #e5e5ea; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
        .word-text { flex-grow: 1; padding-right: 10px; }
        .action-btns button { width: auto; padding: 6px 10px; margin: 0 2px; font-size: 14px; border-radius: 6px; }
        .btn-delete { background-color: #ff3b30; }
    </style>
</head>
<body>

    <div class="container" style="padding-bottom: 5px; background: transparent; box-shadow: none;">
        <div class="top-bar">
            <button class="library-btn" onclick="toggleLibrary()">📚 Бібліотека (<span id="word-count">0</span>)</button>
            <button class="admin-lock-btn" onclick="openAdmin()">🔒</button>
        </div>
        <ul id="word-list" class="container hidden" style="margin-top: 10px;"></ul>
    </div>

    <div id="admin-panel" class="container admin-panel hidden">
        <h2>🛠 Експорт Бази</h2>
        <p style="font-size: 13px; color: #bdc3c7;">Скопіюй цей текст і надішли другу. Він зможе вставити його в поле "Додати слова" у своєму додатку.</p>
        <textarea id="export-text" rows="5" readonly></textarea>
        <button onclick="copyExport()">📋 Скопіювати все</button>
        <button class="close-admin-btn" onclick="closeAdmin()">Закрити</button>
    </div>

    <div class="container">
        <h2>Додати власні слова</h2>
        <p style="font-size: 13px; color: #8e8e93; margin-top: -10px;">Слово - Переклад - Приклад (необов'язково)</p>
        <textarea id="words-input" rows="3" placeholder="apple - яблуко - I eat a red apple"></textarea>
        <button onclick="addWordsBulk()">Додати</button>
    </div>

    <div class="container">
        <select id="mode-selector" onchange="changeMode()">
            <option value="1">1. Англ ➔ Укр (Тест)</option>
            <option value="2">2. Укр ➔ Англ (Тест)</option>
            <option value="3">3. Хард (Писати вручну)</option>
            <option value="4">⏱️ Бліц (60 секунд)</option>
        </select>

        <div class="score-board" id="normal-board">
            <span>🔥 Дні: <span id="streak-count">0</span></span>
            <span>⭐ Комбо: <span id="combo-count">0</span></span>
            <span>🏆 Рекорд: <span id="best-combo">0</span></span>
        </div>

        <div class="blitz-board hidden" id="blitz-board">
            <span>⏳ <span id="timer">60</span>с</span>
            <span>Рахунок: <span id="blitz-score">0</span></span>
        </div>

        <div id="word-to-translate-container">
            <div id="word-to-translate">
                <span id="word-text">...</span>
                <button class="audio-btn" onclick="playAudio()">🔊</button>
            </div>
        </div>
        
        <div id="hint-text" class="hidden"></div>
        <button id="hint-btn" class="hint-btn hidden" onclick="showHint()">💡 Показати приклад</button>

        <div id="options-container">
            <button class="option-btn" onclick="checkAnswer(0)" id="btn-0">Варіант 1</button>
            <button class="option-btn" onclick="checkAnswer(1)" id="btn-1">Варіант 2</button>
            <button class="option-btn" onclick="checkAnswer(2)" id="btn-2">Варіант 3</button>
        </div>

        <div id="hard-mode-container" class="hidden">
            <input type="text" id="hard-input" placeholder="Надрукуй переклад тут..." onkeydown="if(event.key==='Enter') checkHardAnswer()">
            <button style="background-color: #5856d6;" onclick="checkHardAnswer()">Перевірити</button>
        </div>
        
        <div id="feedback"></div>
        <button id="start-blitz-btn" class="hidden" style="background-color: #ff3b30;" onclick="startBlitz()">Почати Бліц!</button>
        <button id="next-btn" class="hidden" onclick="nextWord()">Наступне слово ➔</button>
    </div>

    <script>
        // Базові слова, які завантажуються всім (ти можеш залишити їх або видалити)
        const SHARED_LIBRARY = `
        apple - яблуко - I eat an apple
        always - завжди - I always wake up early
        sun - сонце - The sun is hot
        beautiful - красивий - She is beautiful
        `;

        let dictionary = [];
        let currentWordObj = null;
        let currentMode = "1";
        let currentCombo = { "1": 0, "2": 0, "3": 0 };
        let bestCombo = { "1": 0, "2": 0, "3": 0, "4": 0 }; 
        let blitzActive = false;
        let blitzTime = 60;
        let blitzTimer;
        let currentBlitzScore = 0;

        function loadData() {
            let savedVocab = localStorage.getItem('myVocabPro');
            if (savedVocab) { 
                dictionary = JSON.parse(savedVocab); 
            } else {
                dictionary = [];
            }
            
            mergeSharedLibrary();
            
            let savedBest = localStorage.getItem('myBestCombosPro');
            if (savedBest) bestCombo = JSON.parse(savedBest);

            updateLibraryView();
            updateStreakOnLoad();
            changeMode();
        }

        function mergeSharedLibrary() {
            let lines = SHARED_LIBRARY.split('\n');
            let needsSave = false;
            for (let line of lines) {
                line = line.trim();
                if (!line) continue;
                let parts = line.split(/\s*[-—–=]\s*/);
                if (parts.length >= 2) {
                    let eng = parts[0].trim().toLowerCase();
                    let ukr = parts[1].trim().toLowerCase();
                    let example = parts[2] ? parts[2].trim() : "";
                    let exists = dictionary.some(w => w.eng === eng);
                    if (!exists && eng !== "" && ukr !== "") {
                        dictionary.push({ eng: eng, ukr: ukr, example: example, weight: 3 });
                        needsSave = true;
                    }
                }
            }
            if (needsSave) saveDictionary();
        }

        function saveDictionary() {
            localStorage.setItem('myVocabPro', JSON.stringify(dictionary));
            updateLibraryView();
        }

        /* --- ЛОГІКА АДМІН-ПАНЕЛІ 🔒 --- */
        function openAdmin() {
            let pwd = prompt("Введіть пароль для доступу до експорту:");
            if (pwd === "123") {
                document.getElementById('admin-panel').classList.remove('hidden');
                generateExportText();
            } else if (pwd !== null) {
                alert("Неправильний пароль!");
            }
        }

        function closeAdmin() {
            document.getElementById('admin-panel').classList.add('hidden');
        }

        function generateExportText() {
            let exportArea = document.getElementById('export-text');
            // Перетворюємо всі слова в словнику на текст
            let lines = dictionary.map(w => {
                let ex = w.example ? ` - ${w.example}` : "";
                return `${w.eng} - ${w.ukr}${ex}`;
            });
            exportArea.value = lines.join('\n');
        }

        function copyExport() {
            let exportArea = document.getElementById('export-text');
            exportArea.select();
            exportArea.setSelectionRange(0, 99999); // Для мобільних пристроїв
            
            try {
                navigator.clipboard.writeText(exportArea.value).then(() => {
                    alert("✅ Базу успішно скопійовано! Тепер надішли її другу.");
                });
            } catch (err) {
                // Запасний варіант для старих браузерів
                document.execCommand("copy");
                alert("✅ Базу скопійовано!");
            }
        }
        /* ------------------------------- */

        function updateStreakOnLoad() {
            let streak = parseInt(localStorage.getItem('myStreak') || "0");
            document.getElementById('streak-count').innerText = streak;
        }

        function recordPlayToday() {
            let today = new Date().toDateString();
            let lastDate = localStorage.getItem('lastPlayDate');
            let streak = parseInt(localStorage.getItem('myStreak') || "0");

            if (lastDate !== today) {
                let yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                
                if (lastDate === yesterday.toDateString()) streak++; 
                else streak = 1; 
                
                localStorage.setItem('myStreak', streak);
                localStorage.setItem('lastPlayDate', today);
                document.getElementById('streak-count').innerText = streak;
            }
        }

        function playAudio() {
            if (!currentWordObj) return;
            let speech = new SpeechSynthesisUtterance();
            speech.text = (currentMode === "2") ? currentWordObj.ukr : currentWordObj.eng;
            speech.lang = (currentMode === "2") ? 'uk-UA' : 'en-US';
            speech.rate = 0.9; 
            window.speechSynthesis.speak(speech);
        }

        function updateLibraryView() {
            document.getElementById('word-count').innerText = dictionary.length;
            let listEl = document.getElementById('word-list');
            listEl.innerHTML = "";
            dictionary.forEach((w, index) => {
                let exHtml = w.example ? `<br><small style="color:gray;">${w.example}</small>` : "";
                let li = document.createElement('li');
                li.innerHTML = `
                    <div class="word-text">🇬🇧 <b>${w.eng}</b> — 🇺🇦 ${w.ukr}${exHtml}</div>
                    <div class="action-btns">
                        <button class="btn-delete" onclick="deleteWord(${index})">🗑️</button>
                    </div>
                `;
                listEl.appendChild(li);
            });
        }

        function toggleLibrary() { document.getElementById('word-list').classList.toggle('hidden'); }

        function deleteWord(index) {
            if (confirm(`Видалити слово "${dictionary[index].eng}"?`)) {
                dictionary.splice(index, 1); saveDictionary();
                // Якщо панель адміна відкрита, оновлюємо текст у ній
                if (!document.getElementById('admin-panel').classList.contains('hidden')) {
                    generateExportText();
                }
            }
        }

        function addWordsBulk() {
            let text = document.getElementById('words-input').value.trim();
            if (!text) return;
            let lines = text.split('\n');
            let addedCount = 0;
            for (let line of lines) {
                line = line.trim();
                if (!line) continue;
                let parts = line.split(/\s*[-—–=]\s*/);
                if (parts.length >= 2) {
                    let eng = parts[0].trim().toLowerCase();
                    let ukr = parts[1].trim().toLowerCase();
                    let example = parts[2] ? parts[2].trim() : "";
                    
                    let existingWord = dictionary.find(w => w.eng === eng);
                    if (!existingWord && eng !== "" && ukr !== "") {
                        dictionary.push({ eng: eng, ukr: ukr, example: example, weight: 3 });
                        addedCount++;
                    }
                }
            }
            if (addedCount > 0) {
                saveDictionary();
                document.getElementById('words-input').value = "";
                alert(`Додано ${addedCount} нових слів.`);
                if (!blitzActive) nextWord();
                
                // Якщо панель адміна відкрита, оновлюємо текст у ній
                if (!document.getElementById('admin-panel').classList.contains('hidden')) {
                    generateExportText();
                }
            } else {
                alert("Нових слів не знайдено, або неправильний формат.");
            }
        }

        function getRandomWordSmart() {
            let totalWeight = dictionary.reduce((sum, word) => sum + (word.weight || 1), 0);
            let random = Math.random() * totalWeight;
            let currentSum = 0;
            for (let word of dictionary) {
                currentSum += (word.weight || 1);
                if (random <= currentSum) return word;
            }
            return dictionary[Math.floor(Math.random() * dictionary.length)]; 
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function updateScoreBoard() {
            if(currentMode !== "4") {
                document.getElementById('combo-count').innerText = currentCombo[currentMode] || 0;
                document.getElementById('best-combo').innerText = bestCombo[currentMode] || 0;
            }
        }

        function changeMode() {
            currentMode = document.getElementById('mode-selector').value;
            clearInterval(blitzTimer);
            blitzActive = false;
            
            let normalBoard = document.getElementById('normal-board');
            let blitzBoard = document.getElementById('blitz-board');
            let startBtn = document.getElementById('start-blitz-btn');
            
            document.getElementById('feedback').innerText = "";
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('hard-mode-container').classList.add('hidden');
            document.getElementById('options-container').classList.add('hidden');
            document.getElementById('hint-btn').classList.add('hidden');
            document.getElementById('hint-text').classList.add('hidden');

            if (currentMode === "4") {
                normalBoard.classList.add('hidden');
                blitzBoard.classList.remove('hidden');
                startBtn.classList.remove('hidden');
                document.getElementById('word-text').innerText = `Рекорд: ${bestCombo["4"] || 0}`;
                document.getElementById('timer').innerText = "60";
                document.getElementById('blitz-score').innerText = "0";
            } else {
                normalBoard.classList.remove('hidden');
                blitzBoard.classList.add('hidden');
                startBtn.classList.add('hidden');
                updateScoreBoard();
                nextWord();
            }
        }

        function startBlitz() {
            if(dictionary.length < 3) return alert("Додайте мінімум 3 слова!");
            blitzActive = true;
            blitzTime = 60;
            currentBlitzScore = 0;
            document.getElementById('start-blitz-btn').classList.add('hidden');
            document.getElementById('blitz-score').innerText = currentBlitzScore;
            
            blitzTimer = setInterval(() => {
                blitzTime--;
                document.getElementById('timer').innerText = blitzTime;
                if(blitzTime <= 0) {
                    clearInterval(blitzTimer);
                    endBlitz();
                }
            }, 1000);
            nextWord();
        }

        function endBlitz() {
            blitzActive = false;
            document.getElementById('options-container').classList.add('hidden');
            document.getElementById('start-blitz-btn').classList.remove('hidden');
            document.getElementById('word-text').innerText = "Час вийшов!";
            
            if(currentBlitzScore > (bestCombo["4"] || 0)) {
                bestCombo["4"] = currentBlitzScore;
                localStorage.setItem('myBestCombosPro', JSON.stringify(bestCombo));
                document.getElementById('feedback').innerText = `Новий рекорд: ${currentBlitzScore} слів! 🎉`;
                document.getElementById('feedback').className = "correct";
            } else {
                document.getElementById('feedback').innerText = `Твій результат: ${currentBlitzScore} слів.`;
                document.getElementById('feedback').className = "";
            }
        }

        function showHint() {
            document.getElementById('hint-btn').classList.add('hidden');
            document.getElementById('hint-text').innerText = `Приклад: "${currentWordObj.example}"`;
            document.getElementById('hint-text').classList.remove('hidden');
        }

        function nextWord() {
            if (dictionary.length < 3) {
                document.getElementById('word-text').innerText = "Мало слів!";
                return;
            }

            document.getElementById('feedback').innerText = "";
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('hard-input').value = "";
            
            document.getElementById('hint-text').classList.add('hidden');
            document.getElementById('hint-btn').classList.add('hidden');

            currentWordObj = getRandomWordSmart(); 

            if(currentWordObj.example && currentWordObj.example.trim() !== "" && !blitzActive) {
                document.getElementById('hint-btn').classList.remove('hidden');
            }

            let questionText, answerField, wrongField;

            if (currentMode === "1" || currentMode === "4") {
                questionText = currentWordObj.eng;
                answerField = 'ukr'; wrongField = 'ukr';
                document.getElementById('options-container').classList.remove('hidden');
            } else if (currentMode === "2") {
                questionText = currentWordObj.ukr;
                answerField = 'eng'; wrongField = 'eng';
                document.getElementById('options-container').classList.remove('hidden');
            } else if (currentMode === "3") {
                document.getElementById('options-container').classList.add('hidden');
                document.getElementById('hard-mode-container').classList.remove('hidden');
                questionText = currentWordObj.eng;
                document.getElementById('hard-input').focus();
            }

            document.getElementById('word-text').innerText = questionText;

            if(currentMode !== "3") {
                let options = [currentWordObj[answerField]];
                while (options.length < 3) {
                    let randomWrong = dictionary[Math.floor(Math.random() * dictionary.length)][wrongField];
                    if (!options.includes(randomWrong)) options.push(randomWrong);
                }
                options = shuffleArray(options);
                for (let i = 0; i < 3; i++) {
                    document.getElementById(`btn-${i}`).innerText = options[i];
                }
            }
        }

        function checkAnswer(btnIndex) {
            let selectedAnswer = document.getElementById(`btn-${btnIndex}`).innerText;
            let isCorrect = false;
            
            if (currentMode === "2") isCorrect = (selectedAnswer === currentWordObj.eng);
            else isCorrect = (selectedAnswer === currentWordObj.ukr);
            
            handleResult(isCorrect, (currentMode === "2") ? currentWordObj.eng : currentWordObj.ukr);
        }

        function checkHardAnswer() {
            let userInput = document.getElementById('hard-input').value.trim().toLowerCase();
            if (userInput === "") return;

            let meanings = currentWordObj.ukr.split(/[,/;]/).map(s => s.trim());
            let isCorrect = false;
            for (let meaning of meanings) {
                if (similarity(userInput, meaning) >= 0.70) {
                    isCorrect = true; break;
                }
            }
            handleResult(isCorrect, currentWordObj.ukr);
        }

        function handleResult(isCorrect, rightAnswerText) {
            recordPlayToday(); 
            let feedbackEl = document.getElementById('feedback');
            
            if(isCorrect) {
                currentWordObj.weight = Math.max(1, (currentWordObj.weight || 3) - 1);
            } else {
                currentWordObj.weight = Math.min(10, (currentWordObj.weight || 3) + 2);
            }
            saveDictionary(); 

            if (blitzActive) {
                if(isCorrect) {
                    currentBlitzScore++;
                    document.getElementById('blitz-score').innerText = currentBlitzScore;
                }
                nextWord(); 
                return;
            }

            if (isCorrect) {
                currentCombo[currentMode]++;
                if (currentCombo[currentMode] > (bestCombo[currentMode] || 0)) {
                    bestCombo[currentMode] = currentCombo[currentMode];
                    localStorage.setItem('myBestCombosPro', JSON.stringify(bestCombo));
                }
                feedbackEl.innerText = "Правильно! 🎉";
                feedbackEl.className = "correct";
                document.getElementById('options-container').classList.add('hidden');
                document.getElementById('hard-mode-container').classList.add('hidden');
                setTimeout(nextWord, 800);
            } else {
                currentCombo[currentMode] = 0;
                feedbackEl.innerText = `Помилка. Правильно:\n${rightAnswerText}`;
                feedbackEl.className = "wrong";
                document.getElementById('options-container').classList.add('hidden');
                document.getElementById('hard-mode-container').classList.add('hidden');
                document.getElementById('next-btn').classList.remove('hidden');
            }
            updateScoreBoard();
        }

        function similarity(s1, s2) {
            let longer = s1, shorter = s2;
            if (s1.length < s2.length) { longer = s2; shorter = s1; }
            let longerLength = longer.length;
            if (longerLength === 0) return 1.0;
            return (longerLength - editDistance(longer, shorter)) / parseFloat(longerLength);
        }

        function editDistance(s1, s2) {
            let costs = [];
            for (let i = 0; i <= s1.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= s2.length; j++) {
                    if (i === 0) costs[j] = j;
                    else {
                        if (j > 0) {
                            let newValue = costs[j - 1];
                            if (s1.charAt(i - 1) !== s2.charAt(j - 1))
                                newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                            costs[j - 1] = lastValue;
                            lastValue = newValue;
                        }
                    }
                }
                if (i > 0) costs[s2.length] = lastValue;
            }
            return costs[s2.length];
        }

        loadData();
    </script>
</body>
</html>
